<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2322c55e'/%3E%3Ctext x='50' y='65' font-size='55' text-anchor='middle'%3E🎣%3C/text%3E%3C/svg%3E">
<title>Прогноз клёва</title>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--surface-2:#334155;--text:#f1f5f9;--text-2:#94a3b8;--accent:#22c55e;--accent-2:#f59e0b;--danger:#ef4444;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;max-width:480px;margin:0 auto}
.header{text-align:center;padding:24px 0 16px}
.header h1{font-size:22px;font-weight:600;letter-spacing:-0.5px}
.header p{font-size:13px;color:var(--text-2);margin-top:4px}
.search-wrap{position:relative;margin-bottom:16px}
.search-box{display:flex;gap:8px}
.search-box input{flex:1;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--surface-2);background:var(--surface);color:var(--text);font-size:15px;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box button{padding:12px 20px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:500;cursor:pointer}
.search-box button:active{opacity:0.8}
.search-box button:disabled{opacity:0.5;cursor:wait}
.suggestions{background:var(--surface);border:1px solid var(--surface-2);border-radius:var(--radius);margin-top:4px;max-height:260px;overflow-y:auto;position:absolute;left:0;right:0;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.suggestion-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;align-items:center}
.suggestion-item:last-child{border-bottom:none}
.suggestion-item:hover,.suggestion-item.active{background:var(--surface-2)}
.suggestion-name{font-size:14px;font-weight:500;color:var(--text)}
.suggestion-meta{font-size:11px;color:var(--text-2)}
.suggestion-empty,.suggestion-loading{padding:12px 14px;font-size:13px;color:var(--text-2);text-align:center}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.05)}
.score-big{text-align:center;padding:8px 0}
.score-big .pct{font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score-big .label{font-size:15px;margin-top:6px;font-weight:500}
.score-bar{width:100%;height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;margin:12px 0 4px}
.score-bar-fill{height:100%;border-radius:5px;transition:width 0.8s ease}
.weather-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.weather-grid div{color:var(--text-2)}
.weather-grid span{color:var(--text);font-weight:500}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-2);margin:16px 0 10px;font-weight:600}
.slot-card{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.05)}
.slot-info{display:flex;align-items:center;gap:10px}
.slot-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.slot-date{font-size:11px;color:var(--text-2);margin-bottom:2px}
.slot-time{font-size:14px;font-weight:500}
.slot-dur{font-size:11px;color:var(--text-2)}
.slot-peak{font-weight:800;font-size:13px}
.slot-score{text-align:right}
.slot-score .val{font-size:18px;font-weight:700}
.slot-score .txt{font-size:11px;color:var(--text-2)}
.chart-wrap{background:var(--surface);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.05);padding:12px}
.hidden{display:none !important}
.loading{text-align:center;padding:40px;color:var(--text-2);font-size:14px}
.error{text-align:center;padding:20px;color:var(--danger);font-size:14px}
.location-info{text-align:center;font-size:13px;color:var(--text-2);margin-bottom:12px;min-height:20px}
</style>
</head>
<body>

<div class="header">
  <h1>🎣 Прогноз клёва</h1>
  <p>Укажите город — узнайте, когда ловить</p>
</div>

<div class="search-wrap">
  <div class="search-box">
    <input id="city" type="text" placeholder="Например: Истра" value="Истра" autocomplete="off">
    <button id="btn" onclick="run()">Прогноз</button>
  </div>
  <div id="suggestions" class="suggestions hidden"></div>
</div>

<div id="loading" class="loading hidden">Получаем погоду…</div>
<div id="error" class="error hidden"></div>

<div id="result" class="hidden">
  <div class="location-info" id="location-name"></div>
  <div class="card">
    <div class="score-big">
      <div class="pct" id="score-pct">0%</div>
      <div class="label" id="score-label">—</div>
    </div>
    <div class="score-bar"><div class="score-bar-fill" id="score-bar" style="width:0%"></div></div>
    <div class="weather-grid" id="weather-grid" style="margin-top:12px"></div>
  </div>

  <div class="section-title">★ Лучшие слоты</div>
  <div id="slots-list"></div>

  <div class="section-title">48 часов вперёд</div>
  <div class="chart-wrap" id="hourly"></div>
</div>

<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>console.log('SW registered'));
}
</script>
</body>
</html>
